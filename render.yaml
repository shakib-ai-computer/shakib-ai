# SHAKIB AI — hosted v1 blueprint (Render)
#
# WHAT THIS DEPLOYS (v1, free tier):
#   - shakib-ai-core : the FastAPI Core (services/core), SQLite database
#   - shakib-ai-web  : the built web frontend (apps/web/dist), static
#
# WHAT IT DELIBERATELY DOES NOT DEPLOY (and why):
#   - new-api gateway, PostgreSQL, Redis (the docker-compose.yml stack):
#     too heavy for free hosting tiers, and Docker is not required here.
#     Core's gateway client is pointed DIRECTLY at an OpenAI-compatible
#     provider base instead (OpenRouter, which also routes Gemini
#     models). Core appends "/v1" to GATEWAY_BASE_URL for both chat and
#     research, and https://openrouter.ai/api + /v1 is exactly
#     OpenRouter's API root — Gemini's native /v1beta/openai base does
#     NOT fit that convention unmodified, so it is not used in v1.
#     The full compose stack (with new-api) remains the VPS path —
#     see DEPLOYMENT.md in the goal docs.
#   - Redis: nothing in Core reads REDIS_URL at runtime (config-only).
#   - PostgreSQL: DATABASE_URL stays unset, so Core uses its built-in
#     SQLite default (services/core/data/shakib.db). CAVEAT: Render's
#     free filesystem is EPHEMERAL — the database, uploads and research
#     artifacts are lost on every restart/redeploy. Acceptable for a v1
#     demo; move DATABASE_URL to a hosted Postgres for durable data.
#
# SECRETS: values marked "sync: false" are NOT in this file. Render asks
# for them in the dashboard during the first deploy (see
# DEPLOY-USER-STEPS.md). JWT_SECRET is generated by Render itself.
# ENCRYPTION_KEY is intentionally left unset in v1: Core then derives
# the Fernet key from JWT_SECRET (see services/core/app/security.py).
# Do NOT rotate JWT_SECRET afterwards, or user keys stored in the app
# become undecryptable; set a real ENCRYPTION_KEY before doing so.
#
# PREDICTED URLS (if the service names below are still free):
#   Core: https://shakib-ai-core.onrender.com   Web: https://shakib-ai-web.onrender.com
# If you rename a service, update the other service's URL env vars
# (VITE_API_BASE on the web service, CORS_ORIGINS on Core) to match.

services:
  - type: web
    name: shakib-ai-core
    env: python
    rootDir: services/core
    plan: free
    buildCommand: pip install -r requirements.txt
    # mkdir: the SQLite default lives in ./data, which is git-ignored
    # and therefore absent from a fresh clone; SQLite cannot create
    # the parent directory itself.
    startCommand: mkdir -p data && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # --- model provider (v1: OpenRouter direct, no gateway hop) ---
      - key: GATEWAY_BASE_URL
        value: https://openrouter.ai/api
      - key: GATEWAY_API_KEY
        sync: false # the user's own OpenRouter key (openrouter.ai -> Keys)
      # Model IDs are OpenRouter's. Confirm/adjust in the dashboard —
      # the live catalogue is at openrouter.ai/models.
      - key: MODEL_FAST
        value: google/gemini-2.5-flash-lite,openai/gpt-4o-mini
      - key: MODEL_SMART
        value: google/gemini-2.5-flash,openai/gpt-4o-mini
      - key: MODEL_STRATEGIC
        value: google/gemini-2.5-pro,deepseek/deepseek-chat
      - key: MODEL_EMBEDDING
        value: openai/text-embedding-3-small
      # --- research ---
      - key: TAVILY_API_KEY
        sync: false # the user's own Tavily key (tavily.com -> dashboard)
      - key: RETRIEVER
        value: tavily
      # --- app security / behaviour ---
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_REQUIRED
        value: "true"
      - key: CORS_ORIGINS
        value: https://shakib-ai-web.onrender.com
      - key: TZ
        value: Asia/Dhaka
      # DATABASE_URL intentionally unset -> SQLite dev default (above).

  - type: web
    name: shakib-ai-web
    env: static
    rootDir: apps/web
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      # Baked into the JS bundle at build time. Must be the Core
      # service's public URL (see PREDICTED URLS above).
      - key: VITE_API_BASE
        value: https://shakib-ai-core.onrender.com
